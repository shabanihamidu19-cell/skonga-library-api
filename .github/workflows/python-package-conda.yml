name: Python Package using Conda

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Miniconda and create environment
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: '3.10'
        auto-activate-base: false
        activate-environment: test-env
        environment-file: environment.yml

    - name: Lint with flake8
      run: |
        # Ensure flake8 is available and run linting inside the conda env
        conda run -n test-env pip install --upgrade pip
        conda run -n test-env pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        conda run -n test-env flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        conda run -n test-env flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        # Ensure pytest is available and run tests inside the conda env
        conda run -n test-env pip install pytest
        conda run -n test-env pytest
